name: CI, release et deploiement

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Les jobs obtiennent uniquement les droits supplementaires dont ils ont besoin.
permissions:
  contents: read

env:
  DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.30.0"
  REGISTRY: ghcr.io

# Les pushes rapproches sur la branche de release sont serialises afin d'eviter
# deux calculs de version ou deux deploiements concurrents.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    name: CI frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-manager-cache: false

      - name: Installer les dependances frontend
        run: pnpm --dir frontend install --frozen-lockfile

      # Le script check regroupe ESLint, Prettier, TypeScript et Vitest.
      - name: Lint, formatage, types et tests frontend
        run: pnpm --dir frontend check

      # Ces valeurs ne sont utilisees que pour compiler. Aucune connexion a la
      # base n'est effectuee pendant le build Next.js.
      - name: Verifier le build de production frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-not-a-runtime-secret
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm --dir frontend build

      # La dette HIGH reste visible, sans rendre la CI inutilisable.
      - name: Audit des dependances frontend (rapport HIGH et CRITICAL)
        continue-on-error: true
        run: pnpm --dir frontend audit --prod --audit-level=high

      - name: Bloquer les dependances frontend critiques
        run: pnpm --dir frontend audit --prod --audit-level=critical

  mobile-ci:
    name: CI application mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: appli/pnpm-lock.yaml
          package-manager-cache: false

      - name: Installer les dependances mobiles
        run: pnpm --dir appli install --frozen-lockfile

      # Le script check regroupe ESLint, TypeScript et Jest/Expo.
      - name: Lint, types et tests mobiles
        run: pnpm --dir appli check

      - name: Audit des dependances mobiles (rapport HIGH et CRITICAL)
        continue-on-error: true
        run: pnpm --dir appli audit --prod --audit-level=high

      - name: Bloquer les dependances mobiles critiques
        run: pnpm --dir appli audit --prod --audit-level=critical

  source-security:
    name: Analyse SecOps du depot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Premier passage informatif : dependances, secrets et mauvaises configurations.
      - name: Rapport Trivy HIGH et CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      # Second passage servant de barriere de securite avant toute release.
      - name: Bloquer les failles critiques detectees par Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  release:
    name: Version et release GitHub
    needs:
      - frontend-ci
      - mobile-ci
      - source-security
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Requis par le plugin GitHub de semantic-release.
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic-release.outputs.published }}
      version: ${{ steps.semantic-release.outputs.version }}
      tag: ${{ steps.semantic-release.outputs.tag }}

    steps:
      # L'historique complet et les tags sont indispensables au calcul SemVer.
      - name: Recuperer tout l'historique Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # semantic-release analyse les Conventional Commits, cree le tag vX.Y.Z
      # et publie les notes dans une Release GitHub. Aucun token PAT n'est requis.
      - name: Calculer et publier la release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          npx --yes semantic-release@25.0.8

  build-image:
    name: Construire et publier l'image
    needs:
      - release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.immutable-reference.outputs.image_ref }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR impose un nom d'image en minuscules.
      - name: Calculer le nom de l'image
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Se connecter a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Initialiser l'emulation multi-architecture
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Initialiser Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generer les tags et labels OCI
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Construire et pousser l'image versionnee
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Le deploiement utilise le digest immuable, pas le tag latest mutable.
      - name: Produire la reference immuable
        id: immutable-reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: echo "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  image-security:
    name: Scanner l'image publiee
    needs:
      - build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ github.token }}

    steps:
      - name: Rapport des vulnerabilites HIGH et CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-image.outputs.image_ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Bloquer une image contenant une faille critique
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-image.outputs.image_ref }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  promote-latest:
    name: Promouvoir l'image validee
    needs:
      - build-image
      - image-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}

    steps:
      - name: Se connecter a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Initialiser Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # latest n'est deplace qu'apres le scan bloquant. La version vX.Y.Z et
      # le digest restent les references immuables de la release.
      - name: Promouvoir le digest vers latest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_REF%@*}"
          [[ "$IMAGE_REF" == "$image_name"@sha256:* ]]
          docker buildx imagetools create --tag "$image_name:latest" "$IMAGE_REF"

  deploy:
    name: Deployer en production
    needs:
      - build-image
      - image-security
      - promote-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
    concurrency:
      group: cesizen-production
      cancel-in-progress: false
    env:
      IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
      SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Recuperer les scripts de deploiement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # DEPLOY_SSH_KNOWN_HOSTS doit contenir la cle publique verifiee du serveur,
      # au format known_hosts. On n'utilise volontairement pas ssh-keyscan en CI.
      - name: Configurer et verifier SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Variable DEPLOY_SSH_HOST absente}"
          : "${SSH_USER:?Variable DEPLOY_SSH_USER absente}"
          : "${DEPLOY_PATH:?Variable DEPLOY_PATH absente}"
          : "${SSH_PRIVATE_KEY:?Secret DEPLOY_SSH_PRIVATE_KEY absent}"
          : "${SSH_KNOWN_HOSTS:?Secret DEPLOY_SSH_KNOWN_HOSTS absent}"

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535))
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "/$DEPLOY_PATH/" != *"/../"* ]]
          [[ "$IMAGE_REF" =~ ^ghcr[.]io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]

          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          known_host_query="$SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            known_host_query="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_query" -f "$HOME/.ssh/known_hosts" > /dev/null

      # Le flux tar transfere deploy/ sans dependre de rsync sur le serveur.
      - name: Transferer la configuration de production
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          tar -C deploy -czf - . | ssh "${ssh_options[@]}" \
            "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$DEPLOY_PATH'"

      # deploy.sh recoit le digest en argument, gere la maintenance et
      # garantit une remise en production ou un rollback avec ses traps.
      - name: Mettre a jour le service
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x scripts/*.sh && ./scripts/deploy.sh '$IMAGE_REF'"

      - name: Supprimer la cle SSH du runner
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
