version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cesizen-postgres
    restart: always
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: cesizen_user
      POSTGRES_PASSWORD: cesizen_password
      POSTGRES_DB: cesizen_db
    volumes:
      - cesizen_data:/var/lib/postgresql/data

volumes:
  cesizen_data: