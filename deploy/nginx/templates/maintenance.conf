# This file is rendered after both placeholders have been validated by common.sh.
resolver 127.0.0.11 ipv6=off valid=10s;
set $cesizen_upstream http://__MAINTENANCE_CONTAINER__:__MAINTENANCE_PORT__;

location / {
  proxy_pass $cesizen_upstream;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $cesizen_forwarded_proto;

  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
}
