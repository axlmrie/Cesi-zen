# The variable keeps Nginx startable while cesizen-web is being replaced.
resolver 127.0.0.11 ipv6=off valid=10s;
set $cesizen_upstream http://cesizen-web:3000;

location / {
  proxy_pass $cesizen_upstream;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $cesizen_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $cesizen_connection_upgrade;

  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
