map $http_upgrade $cesizen_connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $cesizen_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  server_tokens off;
  client_max_body_size 10m;

  location = /__router_health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  include /etc/nginx/routes/*.conf;
}
